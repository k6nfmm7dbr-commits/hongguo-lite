# ============================================================
#  红果短剧瘦身 · HongGuo Lite  —— 进阶版 (Plus)
#  ----------------------------------------------------------
#  = 基础版全部规则
#    + 广告请求接口拦截（Map Local 返回空 JSON）
#
#  ⚠️ 本版**需要 MITM + 安装并信任 CA 证书**。
#     如果证书没装好，下面这些改写规则不会生效（不会报错），
#     但域名拦截部分仍然照常工作。
#
#  如果你不想装证书 —— 用 hongguo-lite.yaml（基础版）。
#
#  为什么基础版还不够：
#    穿山甲 SDK 的广告域在基础版里已经整域拦掉了，但红果**自己的
#    API 也会下发广告**（走 *.snssdk.com/api/ad/），这条在域名层
#    看不出任何异常 —— 路径里才写着 ad。只有 MITM 才能看到路径。
#
#  验证 MITM 是否生效：
#     工具 → MITM → 确认 *.snssdk.com 在 hostname 列表里，
#     且「证书」已安装并信任（iOS 设置 → 通用 → VPN与设备管理，
#     以及 设置 → 通用 → 关于本机 → 证书信任设置）。
# ============================================================

name: "红果短剧瘦身 · HongGuo Lite Plus"
description: "基础版全部规则 + 广告请求接口拦截（Map Local 返回空 JSON）。需要 MITM 与信任证书。"
author: "Minis"
homepage: "https://github.com/k6nfmm7dbr-commits/hongguo-lite"
manual: "https://github.com/k6nfmm7dbr-commits/hongguo-lite#readme"
icon: "https://raw.githubusercontent.com/k6nfmm7dbr-commits/hongguo-lite/main/icon.png"
open_url: "https://apps.apple.com/cn/app/id6451407032"


rules:

  # ── 穿山甲 / Pangle 广告 SDK ────────────────────────────
  - domain_keyword:
      match: "pangolin"
      policy: REJECT
  - domain_suffix:
      match: "pglstatp-toutiao.com"
      policy: REJECT
  - domain_suffix:
      match: "pglstatp-toutiao-b.com"
      policy: REJECT

  # ── 广告素材签名域 ──────────────────────────────────────
  - domain_keyword:
      match: "-ad-sign.byteimg.com"
      policy: REJECT

  # ── 广告跳转 ────────────────────────────────────────────
  - domain:
      match: "zlink.ugsdk.cn"
      policy: REJECT

  # ── 字节广告 API 子域 ───────────────────────────────────
  - domain_regex:
      match: "^ads[0-9]+-normal\\.zijieapi\\.com$"
      policy: REJECT

  # ── 埋点 / 上报 ─────────────────────────────────────────
  - domain:
      match: "mon.toutiaocloud.net"
      policy: REJECT
  - domain:
      match: "mon.toutiaocloud.com"
      policy: REJECT
  - domain:
      match: "i.snssdk.com"
      policy: REJECT
  - domain:
      match: "i-lq.snssdk.com"
      policy: REJECT
  - domain:
      match: "is.snssdk.com"
      policy: REJECT
  - domain:
      match: "is-lq.snssdk.com"
      policy: REJECT
  - domain_keyword:
      match: "applog.fqnovel.com"
      policy: REJECT
  - domain_keyword:
      match: "-misc.fqnovel.com"
      policy: REJECT


# ── 广告请求接口 → 直接返回空 JSON ──────────────────────────
# 返回 {} 而不是直接 reject：reject 会断开连接，SDK / App 可能
# 当成网络错误去重试，反而多出请求。给个合法空响应最干净。
map_locals:
  # 穿山甲 SDK 的取广告 / 统计 / 配置接口
  - match: '^https://[^/]*pangolin-sdk-toutiao[^/]*/api/ad/union/sdk/'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  # 红果自己 API 下发的广告
  - match: '^https://[^/]*\.snssdk\.com/api/ad/'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'


# ── 可选：CDN 上的广告素材路径（默认关闭）────────────────────
# 广告安装包、渲染器、马赛克图这些素材走的是字节的通用图片 CDN
# （byteimg.com / pstatp.com），和正常内容**共用域名**，只能靠路径
# 区分。想开就把下面两条取消注释，并把这两个域加进 mitm 的 includes。
#
# 代价：byteimg.com / pstatp.com 是图片主 CDN，解密它们意味着
#       额外 CPU 开销 —— 对已经卡的机器不划算，所以默认关。
#
# url_rewrites:
#   - match: '^https://[^/]*\.byteimg\.com/(ad-app-package|web\.business\.image)'
#     location: "http://reject/"
#   - match: '^https://[^/]*\.(pglstatp-toutiao|pstatp)\.com/(obj|img)/(ad-app-package|ad)/'
#     location: "http://reject/"


# ── MITM ───────────────────────────────────────────────────
# ⚠️ *.snssdk.com 是字节 App 的主 API 域，解密它风险面比较大：
#    如果红果启用了证书固定（cert pinning），会让它连不上，
#    表现是红果打不开 / 一直转圈。真遇到就删掉这一段，
#    回到基础版（基础版的穿山甲拦截已经能干掉大部分广告）。
mitm:
  hostnames:
    includes:
      - "*.pangolin-sdk-toutiao.com"
      - "*.pangolin-sdk-toutiao-b.com"
      - "*.pangolin-sdk-toutiao1.com"
      - "*.snssdk.com"
  # 如果上面的写法在你的 Egern 版本里没生效，改用下面的平铺写法：
  # hostnames:
  #   - "*.pangolin-sdk-toutiao.com"
  #   - "*.pangolin-sdk-toutiao-b.com"
  #   - "*.pangolin-sdk-toutiao1.com"
  #   - "*.snssdk.com"
